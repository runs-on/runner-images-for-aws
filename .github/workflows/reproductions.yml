name: Reproductions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-path:
    name: login shell PATH on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - runs-on=${{ github.run_id }}/env=bootstrap/runner=2cpu-linux-x64/image=ubuntu26-full-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Login shell keeps a prepended PATH
        run: |
          grep -E '^(ImageOS|ImageVersion)=' /etc/environment || true
          readlink -f "$(command -v env)"; readlink -f "$(command -v bash)"; bash --version | head -1
          echo "--- /etc/profile"; cat /etc/profile
          echo "--- /etc/bash.bashrc PATH/environment lines"; grep -nE 'PATH|environment' /etc/bash.bashrc || true
          echo "--- profile.d sourcing /etc/environment"; grep -rln 'environment' /etc/profile.d || true
          echo "--- pam"; grep -rn 'pam_env' /etc/pam.d/ 2>/dev/null | head
          d=$(mktemp -d); h=$(mktemp -d)
          printf '#!/bin/sh\necho stub-ok\n' > "$d/zzstub"; chmod +x "$d/zzstub"
          HOME="$h" PATH="$d:$PATH" bash -lc 'echo "login PATH=$PATH"; command -v zzstub; env zzstub' || echo "LOGIN SHELL LOST PATH"
          echo "--- trace"
          HOME="$h" PATH="$d:$PATH" bash -xlc 'true' 2>&1 | grep -nE 'PATH|environment|^\+ \. |source' | head -40 || true
