name: Reproductions

# TEMPORARY (PR #135): find the CUDA 13.5.0 Windows local installer and its checksum.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          base=https://developer.download.nvidia.com/compute/cuda/13.5.0
          curl -s "$base/local_installers/" | grep -oE 'cuda_13\.5\.0[^"<> ]*windows[^"<> ]*\.exe' | sort -u || true
          curl -s https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/index.html | grep -oE '13\.5[^<]{0,40}(GA|Update)[^<]{0,200}' | head -10 || true
          found=""
          for name in cuda_13.5.0_windows.exe $(for d in 620 621 622 623; do for m in $(seq -w 0 99); do echo "cuda_13.5.0_${d}.${m}_windows.exe"; done; done); do
            code=$(curl -s -o /dev/null -I -w '%{http_code}' "$base/local_installers/$name")
            if [ "$code" = 200 ]; then echo "FOUND $name"; found=$name; break; fi
          done
          [ -n "$found" ] || { echo "no local installer found"; curl -s -o /dev/null -I -w 'network %{http_code}\n' "$base/network_installers/cuda_13.5.0_windows_network.exe"; exit 0; }
          curl -sSfL -o /tmp/i.exe "$base/local_installers/$found"
          echo "URL $base/local_installers/$found"
          sha256sum /tmp/i.exe; stat -c 'size %s' /tmp/i.exe
