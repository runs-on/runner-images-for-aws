name: Reproductions

# TEMPORARY (PR #135): checksum of the CUDA Windows installer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-windows-installer:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          for v in 13.3.1 13.4.3; do
            base=https://developer.download.nvidia.com/compute/cuda/$v
            curl -fsSL "$base/docs/sidebar/md5sum.txt" -o md5-$v.txt
            grep -i windows md5-$v.txt
            line=$(grep -E 'cuda_[0-9.]+(_[0-9.]+)?_windows(_x86_64)?\.exe$' md5-$v.txt | head -1)
            md5=${line%% *}; file=${line##* }
            url="$base/local_installers/$file"
            curl -fsSL "$url" -o installer.exe
            echo "$v url=$url"
            echo "$v md5 expected=$md5 actual=$(md5sum installer.exe | cut -d' ' -f1)"
            echo "$v sha256=$(sha256sum installer.exe | cut -d' ' -f1) bytes=$(stat -c %s installer.exe)"
            rm installer.exe
          done
