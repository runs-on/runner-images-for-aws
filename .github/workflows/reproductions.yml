name: Reproductions

# TEMPORARY (PR #135): compare Windows boot between two windows25-full-x64 AMIs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-boot-diagnostics:
    name: Boot diagnostics ${{ matrix.tag }} ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        tag: [old, new]
        n: [1, 2, 3]
        include:
          - tag: old
            ami: ami-0307672867ea59c7e
          - tag: new
            ami: ami-06865956c276720a3
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.tag }}${{ matrix.n }}/env=bootstrap/volume=60g/family=m7i/cpu=2/ami=${{ matrix.ami }}
    steps:
      - name: Collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $launch = [datetime]::Parse($env:RUNS_ON_INSTANCE_LAUNCHED_AT).ToUniversalTime()
          $os = Get-CimInstance Win32_OperatingSystem
          $boot = $os.LastBootUpTime.ToUniversalTime()
          function rel($t) { [math]::Round(($t.ToUniversalTime() - $launch).TotalSeconds, 1) }
          "launch=$launch lastboot=$boot (+$(rel $os.LastBootUpTime)s) now=+$(rel (Get-Date))s type=$env:RUNS_ON_INSTANCE_TYPE" | Tee-Object "$out/summary.txt"

          # Cumulative disk reads since boot
          Get-CimInstance Win32_PerfRawData_PerfDisk_PhysicalDisk | Where-Object Name -eq '_Total' |
            Select-Object DiskReadsPerSec, DiskReadBytesPerSec, DiskWritesPerSec, DiskWriteBytesPerSec |
            Format-List | Out-String | Tee-Object -Append "$out/summary.txt"

          # Timeline of System and Application events since boot
          $ev = @()
          foreach ($log in 'System','Application','Microsoft-Windows-Diagnostics-Performance/Operational') {
            $ev += Get-WinEvent -FilterHashtable @{ LogName = $log; StartTime = $boot.ToLocalTime().AddSeconds(-30) } -ErrorAction SilentlyContinue
          }
          $ev | Sort-Object TimeCreated | ForEach-Object {
            $m = ($_.Message -split "`r?`n")[0]
            if ($m.Length -gt 160) { $m = $m.Substring(0,160) }
            "{0,7} {1,-50} {2,5} {3}" -f (rel $_.TimeCreated), $_.ProviderName, $_.Id, $m
          } | Set-Content "$out/events.txt"
          Get-Content "$out/events.txt" | Select-Object -First 300

          # EC2Launch timings
          Get-ChildItem 'C:\ProgramData\Amazon\EC2Launch\log' -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$out/ec2launch-$($_.Name)"
          }

          # Services, startup tasks and run keys
          Get-CimInstance Win32_Service | Where-Object { $_.StartMode -eq 'Auto' } | Sort-Object Name |
            ForEach-Object { "{0}`t{1}`t{2}`t{3}" -f $_.Name, $_.State, $_.DelayedAutoStart, $_.PathName } | Set-Content "$out/services-auto.txt"
          Get-ScheduledTask | Where-Object { $_.State -ne 'Disabled' -and ($_.Triggers | Where-Object { $_.CimClass.CimClassName -match 'Boot|Logon|Idle|SessionState' }) } |
            ForEach-Object { "{0}{1}`t{2}" -f $_.TaskPath, $_.TaskName, (($_.Triggers | ForEach-Object { $_.CimClass.CimClassName }) -join ',') } | Sort-Object | Set-Content "$out/tasks-startup.txt"
          & { foreach ($k in 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run','HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run') {
            "== $k"; (Get-ItemProperty $k -ErrorAction SilentlyContinue | Out-String)
          } } | Set-Content "$out/runkeys.txt"

          # Processes by CPU, with start time relative to launch
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 40 | ForEach-Object {
            "{0,-40} cpu={1,8:N1} start=+{2}" -f $_.ProcessName, $_.CPU, $(if ($_.StartTime) { rel $_.StartTime } else { '?' })
          } | Tee-Object "$out/processes.txt"

          # Boot layout packing left by Optimize-BootLayout.ps1
          $list = 'C:\ProgramData\RunsOn\bootlayout.txt'
          if (Test-Path $list) {
            $files = Get-Content $list
            $bytes = ($files | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { (Get-Item -LiteralPath $_ -Force).Length } | Measure-Object -Sum).Sum
            "bootlayout: $($files.Count) files, $([math]::Round($bytes/1MB)) MB" | Tee-Object -Append "$out/summary.txt"
            Copy-Item $list "$out/bootlayout.txt"
          } else { "bootlayout: missing" | Tee-Object -Append "$out/summary.txt" }
          Get-ChildItem C:\ProgramData\RunsOn -Force -ErrorAction SilentlyContinue | Out-String | Tee-Object -Append "$out/summary.txt"

          # Pending reboot or servicing work
          foreach ($k in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') {
            "$k exists=$(Test-Path $k)" | Tee-Object -Append "$out/summary.txt"
          }
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue).PendingFileRenameOperations | Measure-Object | ForEach-Object { "PendingFileRenameOperations=$($_.Count)" } | Tee-Object -Append "$out/summary.txt"
          "SysMain: $((Get-Service SysMain -ErrorAction SilentlyContinue).Status)" | Tee-Object -Append "$out/summary.txt"
          (Get-CimInstance Win32_SystemDriver | Where-Object State -eq 'Running').Count | ForEach-Object { "running drivers=$_" } | Tee-Object -Append "$out/summary.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diag-${{ matrix.tag }}${{ matrix.n }}
          path: ${{ runner.temp }}/diag
