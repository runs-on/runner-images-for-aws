name: Reproductions

# TEMPORARY (PR #135): find the CUDA 13.5.0 Windows local installer and its checksum.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          for v in 13.5.0 13.4.3 13.3.1; do
            for p in "cuda-${v//./-}-download-archive" "cuda-downloads"; do
              curl -sL -A 'Mozilla/5.0' "https://developer.nvidia.com/$p?target_os=Windows&target_arch=x86_64&target_version=Server2025&target_type=exe_local" \
                | grep -oE 'https?:[^"<> ]*(local|network)_installers[^"<> ]*\.exe' | sed "s/^/$v $p: /" | sort -u
            done
          done
          url=https://developer.download.nvidia.com/compute/cuda/13.5.0/local_installers/cuda_13.5.0_windows_x86_64.exe
          echo "URL=$url"
          [ -n "$url" ] || exit 0
          curl -sSfL -o /tmp/i.exe "$url"
          sha256sum /tmp/i.exe; stat -c 'size %s' /tmp/i.exe
