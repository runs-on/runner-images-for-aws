name: Reproductions

# TEMPORARY (PR #135): find why nvcc 13.3 crashes (cudafe++ ACCESS_VIOLATION) with VS 2026.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-vs2026:
    name: CUDA vs VS 2026 on windows25-gpu-x64
    runs-on: runs-on=${{ github.run_id }}/env=bootstrap/volume=60g/family=g4dn/cpu=4/ami=ami-006f33d2cc35fbba9
    timeout-minutes: 60
    steps:
      - name: Diagnose
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -format text | Select-String 'installationVersion|displayName|catalog_productDisplayVersion'
          $vs = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          $vsDevCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          Write-Host "== MSVC toolsets"; Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') | ForEach-Object Name
          cmd.exe /d /s /c "call `"$vsDevCmd`" -arch=x64 >nul && cl.exe 2>&1 | findstr Version"
          $nvcc133 = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\nvcc.exe'
          & $nvcc133 --version | Select-String release

          $d = $env:RUNNER_TEMP
          '__global__ void k(int* v) { *v = 42; }' | Set-Content "$d\a.cu" -Encoding ascii
          "#include <cuda_runtime.h>`n__global__ void k(int* v) { *v = 42; }`nint main() { int* v; cudaMalloc(&v, 4); k<<<1,1>>>(v); return cudaDeviceSynchronize(); }" | Set-Content "$d\b.cu" -Encoding ascii
          "#include <cstdio>`nint main() { std::printf(`"hi\n`"); return 0; }" | Set-Content "$d\c.cu" -Encoding ascii
          "#include <cuda_runtime.h>`n#include <cstdio>`n__global__ void k(int* v) { *v = 42; }`nint main() { int* v; cudaMallocManaged(&v, 4); k<<<1,1>>>(v); cudaDeviceSynchronize(); std::printf(`"%d\n`", *v); return *v == 42 ? 0 : 1; }" | Set-Content "$d\d.cu" -Encoding ascii

          function Try-Compile($label, $nvcc, $src, $extra) {
            $out = "$d\$label.exe"
            $r = cmd.exe /d /s /c "call `"$vsDevCmd`" -arch=x64 >nul && `"$nvcc`" -arch=sm_75 $extra `"$src`" -o `"$out`" 2>&1"
            $code = $LASTEXITCODE
            Write-Host "== RESULT $label exit=$code"
            $r | Select-Object -Last 6 | ForEach-Object { Write-Host "   $_" }
            if ($code -eq 0 -and (Test-Path $out)) { $o = & $out 2>&1; Write-Host "   run exit=$LASTEXITCODE out=$o" }
          }
          Try-Compile '133-nohdr' $nvcc133 "$d\a.cu" '-c'
          Try-Compile '133-cudart' $nvcc133 "$d\b.cu" ''
          Try-Compile '133-cstdio' $nvcc133 "$d\c.cu" ''
          Try-Compile '133-smoke' $nvcc133 "$d\d.cu" ''
          Try-Compile '133-smoke-cpp17' $nvcc133 "$d\d.cu" '-std=c++17'
          Try-Compile '133-smoke-keep' $nvcc133 "$d\d.cu" '-Xcudafe --display_error_number'

          Write-Host "== latest CUDA redist"
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist/'
          $index = (Invoke-WebRequest $base -UseBasicParsing).Content
          $vers = [regex]::Matches($index, 'redistrib_(13\.\d+\.\d+)\.json') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique { [version]$_ }
          Write-Host "13.x redists: $($vers -join ', ')"
          $latest = $vers | Select-Object -Last 1
          $json = Invoke-RestMethod "$base/redistrib_$latest.json"
          $root = "C:\cuda-$latest"
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($p in 'cuda_nvcc','cuda_crt','cuda_cudart','cuda_nvvm','libnvvm') {
            $pkg = $json.$p
            if (-not $pkg) { Write-Host "no package $p"; continue }
            $rel = $pkg.'windows-x86_64'.relative_path
            Write-Host "$p $($pkg.version) $rel"
            $zip = "$d\$p.zip"
            Invoke-WebRequest "$base/$rel" -OutFile $zip -UseBasicParsing
            $x = "$d\x-$p"; Expand-Archive $zip $x -Force
            $top = Get-ChildItem $x | Select-Object -First 1
            Copy-Item "$($top.FullName)\*" $root -Recurse -Force
          }
          Try-Compile "$latest-smoke" "$root\bin\nvcc.exe" "$d\d.cu" ''
          Try-Compile "$latest-cstdio" "$root\bin\nvcc.exe" "$d\c.cu" ''

          Write-Host "== installer for $latest"
          $installer = "https://developer.download.nvidia.com/compute/cuda/$latest/local_installers/cuda_${latest}_windows.exe"
          try {
            $f = "$d\cuda_installer.exe"
            Invoke-WebRequest $installer -OutFile $f -UseBasicParsing
            Write-Host "$installer sha256=$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower()) size=$((Get-Item $f).Length)"
          } catch { Write-Host "installer download failed: $_" }
          exit 0
