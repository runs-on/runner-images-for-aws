name: Reproductions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liblzma-parity:
    name: liblzma on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - runs-on=${{ github.run_id }}/env=bootstrap/runner=2cpu-linux-x64/image=ubuntu24-full-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Inspect liblzma
        run: |
          head -2 /etc/os-release
          dpkg -l 'liblzma*' | grep '^ii' || true
          echo "installed reverse deps of liblzma-dev:"
          apt-cache rdepends --installed liblzma-dev 2>/dev/null || true
          ls -l /usr/lib/x86_64-linux-gnu/liblzma.* || true
          pkg-config --modversion --libs liblzma || echo "pkg-config: no liblzma"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"; grep -i pkg_config /etc/environment || true
          sudo find /usr /opt -name 'liblzma.pc' 2>/dev/null || true
          echo "dpkg -dev count: $(dpkg -l | grep -c '^ii  lib.*-dev')"
          dpkg -l | awk '/^ii  lib.*-dev/{print $2}' | sed 's/:amd64//' | sort > dev-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-packages-${{ strategy.job-index }}
          path: dev-packages.txt
