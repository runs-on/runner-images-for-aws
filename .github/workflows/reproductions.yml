name: Reproductions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-20-setup-python-isolated-ubuntu24-full-x64:
    name: issue 20 isolated setup-python on ubuntu24-full-x64
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/image=ubuntu24-full-x64
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Check isolated Python invocation
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          echo "python_path=${python_path}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          env -i "${python_path}" -c 'import sys; print(sys.version)'

  php-ubuntu24-arm64:
    name: Fast PHP installs on ubuntu24-full-arm64
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-arm64/image=ubuntu24-dev-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Show PHP defaults
        run: |
          command -v php || true
          php -v || true
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
      - name: Check PHP 8.3
        run: php -v
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
      - name: Check PHP 8.4
        run: php -v

  git-lfs-ubuntu24-arm64:
    name: git-lfs on ubuntu24-full-arm64
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-arm64/image=ubuntu24-dev-arm64
    steps:
      - name: Check git-lfs is available
        run: |
          command -v git-lfs
          git-lfs version

  imageos-ubuntu24-x64:
    name: ImageOS/ImageVersion on ubuntu24-full-x64
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/image=ubuntu24-full-x64
    steps:
      - name: Check ImageOS and ImageVersion env vars
        run: |
          echo "ImageOS=$ImageOS"
          echo "ImageVersion=$ImageVersion"
          test -n "$ImageOS" || (echo "ERROR: ImageOS is not set" && exit 1)
          test -n "$ImageVersion" || (echo "ERROR: ImageVersion is not set" && exit 1)

  issue-61-apt-cdn-ubuntu24-full-x64:
    name: issue 61 CDN apt mirror on ubuntu24-full-x64
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/image=ubuntu24-dev-x64
    steps:
      - name: Check apt mirror and acquire settings
        run: |
          set -euo pipefail

          sources=()
          [ ! -f /etc/apt/sources.list ] || sources+=(/etc/apt/sources.list)
          [ ! -f /etc/apt/sources.list.d/ubuntu.sources ] || sources+=(/etc/apt/sources.list.d/ubuntu.sources)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No apt sources found" >&2
            exit 1
          fi

          sed -n '1,120p' "${sources[@]}"
          if ! grep -E 'https://archive\.ubuntu\.com/ubuntu/?' "${sources[@]}"; then
            echo "Expected apt sources to use archive.ubuntu.com" >&2
            exit 1
          fi
          if grep -E 'https?://[^/]+\.ec2\.(archive|ports)\.ubuntu\.com/' "${sources[@]}"; then
            echo "Found a regional EC2 apt mirror" >&2
            exit 1
          fi

          apt-config dump | grep -Fx 'Acquire::Retries "5";'
          apt-config dump | grep -Fx 'Acquire::http::Timeout "20";'
          apt-config dump | grep -Fx 'Acquire::https::Timeout "20";'
          sudo apt-get update -y

  issue-31-runner-home-path-ubuntu24-full-x64:
    name: issue 31 runner HOME paths on ubuntu24-full-x64
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/image=ubuntu24-dev-x64
    steps:
      - name: Check runner HOME paths and tools
        shell: bash
        run: |
          set -euo pipefail

          literal_home="\$HOME"
          if grep -qF "${literal_home}" /etc/environment; then
            echo "/etc/environment contains a literal ${literal_home}" >&2
            exit 1
          fi

          case "${PATH}" in
            *"${literal_home}"*) echo "PATH contains a literal ${literal_home}" >&2; exit 1 ;;
          esac

          for expected in \
            /home/runner/.local/bin \
            /home/runner/.cargo/bin \
            /home/runner/.config/composer/vendor/bin \
            /home/runner/.dotnet/tools; do
            case ":${PATH}:" in
              *":${expected}:"*) ;;
              *) echo "PATH is missing ${expected}" >&2; exit 1 ;;
            esac
          done

          command -v cargo
          command -v rustup
          command -v dotnet

  issue-41-ubuntu24-gpu-arm64:
    name: issue 41 Ubuntu 24 GPU ARM64 on g5g
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-arm64/image=ubuntu24-gpu-arm64/family=g5g
    steps:
      - name: Check native CUDA 13 and the open driver
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = arm64
          nvcc --version | grep -F "release 13.0"
          modinfo -F license nvidia | grep -F "Dual MIT/GPL"
          nvidia-smi
          nvidia-smi -L
      - name: Check CUDA 13 container access
        run: docker run --rm --gpus all nvidia/cuda:13.0.2-base-ubuntu24.04 nvidia-smi -L

  issue-46-ubuntu24-cuda13-x64:
    name: issue 46 CUDA 13 on Ubuntu 24 GPU x64
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/image=ubuntu24-gpu-x64/family=g4dn
    steps:
      - name: Check native CUDA 13
        run: |
          set -euo pipefail
          nvcc --version | grep -F "release 13.0"
          nvidia-smi
          nvidia-smi -L
      - name: Check CUDA 13 container access
        run: docker run --rm --gpus all nvidia/cuda:13.0.2-base-ubuntu24.04 nvidia-smi -L

  issue-55-ubuntu24-blackwell-x64:
    name: issue 55 Ubuntu 24 open driver on Blackwell
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64/image=ubuntu24-gpu-x64/family=g7e
    steps:
      - name: Check Blackwell with the open driver
        run: |
          set -euo pipefail
          modinfo -F license nvidia | grep -F "Dual MIT/GPL"
          nvidia-smi --query-gpu=name --format=csv,noheader | grep -i blackwell
          nvidia-smi -L
      - name: Check CUDA 13 container access
        run: docker run --rm --gpus all nvidia/cuda:13.0.2-base-ubuntu24.04 nvidia-smi -L

  issue-19-windows25-hyperv-vs-cpp:
    name: issue-19 windows25 Hyper-V + VS + C++
    runs-on: runs-on=${{ github.run_id }}/image=windows25-dev-x64/family=m8i
    steps:
      - name: Check Visual Studio install
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $installPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          if (-not $installPath) { throw "Visual Studio installation path not found" }
          $devenv = Join-Path $installPath "Common7\IDE\devenv.exe"
          if (-not (Test-Path $devenv)) { throw "devenv.exe not found at $devenv" }
          Write-Host "Visual Studio installation path: $installPath"

      - name: Check C++ toolchain (cl.exe)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          if (-not $installPath) { throw "Visual Studio installation path not found" }
          $vsDevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd.bat not found at $vsDevCmd" }
          cmd.exe /c "\"$vsDevCmd\" -arch=x64 >nul && where cl"
          if ($LASTEXITCODE -ne 0) { throw "cl.exe not found from VS developer command prompt" }

      - name: Check issue-19 package set
        shell: pwsh
        run: |
          $required = @("bash", "cargo", "rustc", "pwsh", "AzureSignTool")
          foreach ($tool in $required) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $found) { throw "$tool was not found on PATH" }
            Write-Host "$tool => $($found.Source)"
          }
          pwsh --version
          cargo --version
          rustc --version
          AzureSignTool --version

      - name: Check Hyper-V feature states
        shell: pwsh
        run: |
          $serverFeatures = @("Hyper-V", "Hyper-V-PowerShell")
          foreach ($feature in $serverFeatures) {
            $state = (Get-WindowsFeature -Name $feature).InstallState
            Write-Host "$feature=$state"
            if ($state -ne "Installed") { throw "$feature is not Installed" }
          }
          $optionalState = (Get-WindowsOptionalFeature -Online -FeatureName "HypervisorPlatform").State
          Write-Host "HypervisorPlatform=$optionalState"
          if ($optionalState -ne "Enabled") { throw "HypervisorPlatform is not Enabled" }

      - name: Hyper-V diagnostics (systeminfo)
        shell: pwsh
        run: |
          systeminfo
