name: Cleanup production AMIs

concurrency:
  group: cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 */3 * *'

jobs:
  cleanup:
    timeout-minutes: 30
    # ubuntu-latest is Ubuntu 26.04, where ruby/setup-ruby has no Ruby 3.2.2 build.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: bundle exec bin/utils/cleanup-amis -f --prod
