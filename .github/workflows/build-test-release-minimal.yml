name: Build Test Release Minimal
run-name: ${{ inputs.image_id }}

on:
  workflow_call:
    inputs:
      # e.g. ubuntu24-minimal-x64
      image_id:
        required: true
        type: string
    outputs:
      ami_name:
        description: "The name of the built AMI"
        value: ${{ jobs.build.outputs.ami_name }}
      ami_id:
        description: "The ID of the built AMI"
        value: ${{ jobs.build.outputs.ami_id }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      image_id: ${{ inputs.image_id }}
    secrets: inherit

  test:
    name: Test
    needs:
      - build
    runs-on: runs-on=${{ github.run_id }}/env=bootstrap/family=m7/cpu=2+4/ami=${{ needs.build.outputs.ami_id }}
    steps:
      - name: Ensure apt-get update is working
        run: sudo apt-get update
      - name: Ensure code can be checked out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Docker
        run: |
          docker version
          docker run hello-world
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - name: Node.js
        run: |
          node --version
          npm --version
      - name: ICU
        run: ldconfig -p | grep -E 'libicu(uc|i18n)\.so\.'
      # Installs into the default /usr/share/dotnet, as on the full images.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: .NET cultures
        working-directory: ${{ runner.temp }}
        env:
          # Agents before v3.5.1 start the runner in invariant mode on every
          # image; test what the image provides.
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
        run: |
          dotnet new console --output cultures
          cat > cultures/Program.cs <<'EOF'
          using System.Globalization;
          Console.WriteLine(new CultureInfo("tr-TR").TextInfo.ToUpper("i"));
          EOF
          upper="$(dotnet run --project cultures)"
          echo "$upper"
          test "$upper" = "İ"

  release:
    if: ${{ !failure() && !cancelled() }}
    needs:
      - build
      - test
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      image_id: ${{ inputs.image_id }}
      ami_name: ${{ needs.build.outputs.ami_name }}
