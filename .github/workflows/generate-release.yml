name: Generate release

# Reusable release-aggregation job shared by the matrix-* workflows: collects
# the released-ami-* artifacts and publishes a GitHub release.
on:
  workflow_call:
    inputs:
      release_name:
        description: 'Tag name for the GitHub release'
        type: string
        required: true

jobs:
  generate-release:
    name: Generate release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: released-ami-*
          path: release-summaries
          merge-multiple: true
      - name: Render release changelog
        run: ruby bin/render-release-changelog release-summaries > release-body.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-body.md
          tag_name: ${{ inputs.release_name }}
          # Release jobs can wait days for approval; tag the built commit, not main at publish time.
          target_commitish: ${{ github.sha }}
          make_latest: true
